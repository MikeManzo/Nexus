name: Nexus
options:
  bundleIdPrefix: com.nexusapp
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  Nexus:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Nexus
    info:
      path: Nexus/Info.plist
      properties:
        CFBundleDisplayName: Nexus
        LSUIElement: true
        # Without this, macOS's window-restoration ("Resume") reopens whatever window (Settings,
        # Manage Desktops) was on screen the last time the app quit — which for a menu-bar-only
        # utility should never happen automatically on launch.
        NSQuitAlwaysKeepsWindows: false
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        # GitHub's "latest release" asset URL — a stable link that always serves whatever
        # appcast.xml scripts/release.sh most recently uploaded, so this never needs to change
        # between releases.
        SUFeedURL: "https://github.com/MikeManzo/Nexus/releases/latest/download/appcast.xml"
        # Public half of the "nexus" Keychain-account EdDSA key pair. Never put the private key here.
        SUPublicEDKey: "J4Jl3C3l/Ig8gqui+209SVylAWPuKtzE0u9JqjCGKKo="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexusapp.Nexus
        PRODUCT_NAME: Nexus
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_APP_SANDBOX: NO
        # Without a real, stable identity here, local builds fall back to an ad-hoc signature —
        # confirmed via `codesign -dvvv` (Signature=adhoc) and the TCC daemon's own log ("Failed
        # to match existing code requirement for ... Nexus and service kTCCServiceScreenCapture").
        # An ad-hoc signature's requirement is tied to that exact build's content hash, so it
        # changes on every rebuild — any permission the user grants (Screen Recording,
        # Accessibility) stops matching the moment Xcode rebuilds the app, even though nothing
        # about *that* changed. `CODE_SIGN_STYLE: Automatic` (tried first) wanted a
        # provisioning-profile-managed "Mac Development" certificate, which doesn't exist for
        # either team in this Keychain — and Nexus doesn't need one anyway, since it's distributed
        # directly + notarized, never through the Mac App Store. Manual signing with the same
        # Developer ID Application identity the real release is signed with (see
        # `scripts/release.sh`, which overrides both of these explicitly for that build, so this
        # only affects local Debug/Xcode-run builds) sidesteps provisioning profiles entirely.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: 3ETXMLGRJN
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
  NexusTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NexusTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexusapp.NexusTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Nexus
schemes:
  Nexus:
    build:
      targets:
        Nexus: all
        NexusTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NexusTests
    archive:
      config: Release
